<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not Found · IDOR.guide</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" type="image/svg+xml" href="/idor-guide/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0c11;
  --bg-elev: #11151c;
  --border: #1f2731;
  --border-light: #2a3340;
  --text: #e8ecf1;
  --text-secondary: #a3acba;
  --text-muted: #6b7585;
  --accent: #ff6b35;
  --accent-soft: rgba(255, 107, 53, 0.12);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 600px; width: 100%; text-align: center; }
.code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
}
.big {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(72px, 18vw, 132px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}
h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 600;
  margin-bottom: 14px;
}
p { color: var(--text-secondary); margin-bottom: 28px; }
p code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88em;
  background: #0d1117;
  border: 1px solid var(--border);
  padding: 1px 7px;
  border-radius: 4px;
  color: var(--accent);
}
.actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14.5px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 7px;
  border: 1px solid transparent;
  text-decoration: none;
  transition: all 0.15s ease;
}
.btn-primary { background: var(--accent); color: #0a0c11; }
.btn-primary:hover { background: #ff855c; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-light); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.note {
  margin-top: 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">// HTTP 404</div>
    <div class="big">404</div>
    <h1>This object reference doesn't resolve.</h1>
    <p>The page you asked for isn't here — no authorization check required to tell you that. Head back to the guide and pick up where you left off.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/idor-guide/">← Back to the guide</a>
      <a class="btn btn-ghost" href="/idor-guide/cheatsheet.html">One-page cheatsheet</a>
    </div>
    <div class="note">IDOR.guide · v.2026 · OWASP 2025-aligned</div>
  </main>
</body>
</html>
